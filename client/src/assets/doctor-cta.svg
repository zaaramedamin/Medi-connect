<svg viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doctor schedule dashboard illustration">
  <defs>
    <linearGradient id="cta-blob" x1="0" y1="0" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B9C8B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0B72C1" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="cta-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B72C1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background blob -->
  <path d="M260 16c96-18 204 22 230 112 24 84-30 170-112 214-82 44-196 50-270-6C36 282 8 194 44 120 80 46 164 34 260 16Z" fill="url(#cta-blob)"/>

