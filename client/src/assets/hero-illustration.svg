<svg viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doctor profile and appointment booking illustration">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B72C1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1B9C8B" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B72C1"/>
      <stop offset="1" stop-color="#0A5E9E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B72C1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background blob -->
  <path d="M320 30c120-24 250 30 282 140 30 104-38 208-140 262-100 54-238 62-330-6C42 359 8 250 52 158 96 66 200 54 320 30Z" fill="url(#blob)"/>

  <!-- dashed connector -->
  <path d="M382 300c60 24 120 10 158-52" stroke="#0B72C1" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- doctor profile card -->
  <g filter="url(#soft)">
    <rect x="92" y="128" width="292" height="322" rx="24" fill="#FFFFFF"/>
    <rect x="92.75" y="128.75" width="290.5" height="320.5" rx="23.25" stroke="#E2ECF5" stroke-width="1.5"/>
  </g>

  <!-- avatar -->
  <circle cx="238" cy="222" r="58" fill="#E3F1FC"/>
  <clipPath id="avclip"><circle cx="238" cy="222" r="58"/></clipPath>
  <g clip-path="url(#avclip)">
    <!-- neck & head -->
    <rect x="228" y="216" width="20" height="26" rx="8" fill="#EBB48E"/>
    <circle cx="238" cy="200" r="24" fill="#F2C09E"/>
    <path d="M214 196c0-16 11-26 24-26s24 10 24 26c-6-10-14-13-24-13s-18 3-24 13Z" fill="#3E4C5E"/>
    <!-- white coat -->
    <path d="M186 282c2-32 24-46 52-46s50 14 52 46l2 20H184l2-20Z" fill="#FFFFFF"/>
    <path d="M238 236l-14 10 14 34 14-34-14-10Z" fill="#1B9C8B"/>
    <path d="M224 246l-20 8c-6 3-10 8-11 18l-3 30h26l8-56ZM252 246l20 8c6 3 10 8 11 18l3 30h-26l-8-56Z" fill="#F5F9FD"/>
    <!-- stethoscope -->
    <path d="M216 258c0 18 8 28 22 28s22-10 22-28" stroke="#0B72C1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="260" cy="288" r="7" fill="#0B72C1"/>
    <circle cx="260" cy="288" r="3" fill="#FFFFFF"/>
  </g>

  <!-- verified badge on avatar -->
  <circle cx="282" cy="262" r="15" fill="#1B9C8B" stroke="#FFFFFF" stroke-width="3.5"/>
  <path d="M275.5 262l4.5 4.5 8-9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- name + specialty -->
  <rect x="164" y="300" width="148" height="13" rx="6.5" fill="#25384E"/>
  <rect x="186" y="323" width="104" height="22" rx="11" fill="#E3F1FC"/>
  <rect x="202" y="331" width="72" height="7" rx="3.5" fill="#0B72C1"/>

  <!-- meta lines -->
  <circle cx="150" cy="372" r="5" fill="#94ACC4"/>
  <rect x="164" y="368" width="120" height="9" rx="4.5" fill="#D6E2EE"/>
  <circle cx="150" cy="394" r="5" fill="#94ACC4"/>
  <rect x="164" y="390" width="88" height="9" rx="4.5" fill="#D6E2EE"/>

  <!-- book button -->
  <rect x="128" y="410" width="220" height="26" rx="13" fill="url(#btn)"/>
  <rect x="196" y="420" width="84" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- calendar card -->
  <g filter="url(#soft)">
    <rect x="368" y="86" width="212" height="216" rx="20" fill="#FFFFFF"/>
    <rect x="368.75" y="86.75" width="210.5" height="214.5" rx="19.25" stroke="#E2ECF5" stroke-width="1.5"/>
  </g>
  <path d="M368 106c0-11 9-20 20-20h172c11 0 20 9 20 20v24H368v-24Z" fill="#0B72C1"/>
  <rect x="384" y="102" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="552" cy="106" r="6" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="532" cy="106" r="6" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- day-of-week dots -->
  <g fill="#B9CCDD">
    <rect x="386" y="142" width="18" height="6" rx="3"/>
    <rect x="414" y="142" width="18" height="6" rx="3"/>
    <rect x="442" y="142" width="18" height="6" rx="3"/>
    <rect x="470" y="142" width="18" height="6" rx="3"/>
    <rect x="498" y="142" width="18" height="6" rx="3"/>
    <rect x="526" y="142" width="18" height="6" rx="3"/>
  </g>

  <!-- day grid -->
  <g fill="#EDF3F9">
    <rect x="384" y="160" width="22" height="22" rx="6"/>
    <rect x="412" y="160" width="22" height="22" rx="6"/>
    <rect x="440" y="160" width="22" height="22" rx="6"/>
    <rect x="468" y="160" width="22" height="22" rx="6"/>
    <rect x="496" y="160" width="22" height="22" rx="6"/>
    <rect x="524" y="160" width="22" height="22" rx="6"/>
    <rect x="384" y="190" width="22" height="22" rx="6"/>
    <rect x="412" y="190" width="22" height="22" rx="6"/>
    <rect x="468" y="190" width="22" height="22" rx="6"/>
    <rect x="496" y="190" width="22" height="22" rx="6"/>
    <rect x="524" y="190" width="22" height="22" rx="6"/>
    <rect x="384" y="220" width="22" height="22" rx="6"/>
    <rect x="412" y="220" width="22" height="22" rx="6"/>
    <rect x="440" y="220" width="22" height="22" rx="6"/>
    <rect x="468" y="220" width="22" height="22" rx="6"/>
    <rect x="524" y="220" width="22" height="22" rx="6"/>
    <rect x="384" y="250" width="22" height="22" rx="6"/>
    <rect x="440" y="250" width="22" height="22" rx="6"/>
    <rect x="468" y="250" width="22" height="22" rx="6"/>
    <rect x="496" y="250" width="22" height="22" rx="6"/>
  </g>

  <!-- selected day -->
  <rect x="440" y="190" width="22" height="22" rx="6" fill="#1B9C8B"/>
  <path d="M446 201l4 4 7-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- today outline -->
  <rect x="497" y="251" width="20" height="20" rx="5" stroke="#0B72C1" stroke-width="2" fill="none"/>

  <!-- confirmation toast -->
  <g filter="url(#soft)" class="float">
    <rect x="330" y="330" width="238" height="64" rx="16" fill="#FFFFFF"/>
    <rect x="330.75" y="330.75" width="236.5" height="62.5" rx="15.25" stroke="#E2ECF5" stroke-width="1.5"/>
  </g>
  <circle cx="362" cy="362" r="16" fill="#DCF5EF"/>
  <path d="M354.5 362l5 5 9.5-10" stroke="#1B9C8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="390" y="348" width="132" height="10" rx="5" fill="#25384E"/>
  <rect x="390" y="366" width="96" height="8" rx="4" fill="#D6E2EE"/>

  <!-- heart-pulse badge -->
  <g filter="url(#soft)">
    <circle cx="112" cy="96" r="34" fill="#FFFFFF"/>
  </g>
  <path d="M112 112s-19-11-19-24c0-7 5-12 11-12 4 0 7 2 8 5 1-3 4-5 8-5 6 0 11 5 11 12 0 13-19 24-19 24Z" fill="#E8556D"/>
  <path d="M97 96h7l4-8 5 14 4-6h9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- decorative plus signs & dots -->
  <g stroke="#0B72C1" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <path d="M598 340v20M588 350h20"/>
    <path d="M76 320v14M69 327h14"/>
    <path d="M508 44v14M501 51h14"/>
  </g>
  <circle cx="608" cy="196" r="6" fill="#1B9C8B" fill-opacity="0.5"/>
  <circle cx="52" cy="196" r="5" fill="#0B72C1" fill-opacity="0.4"/>
  <circle cx="316" cy="60" r="5" fill="#E8556D" fill-opacity="0.45"/>
</svg>
