# MediConnect — Render Blueprint
#
# Deploys the Express API as a Node web service. The React client is deployed
# separately on Vercel (see client/vercel.json and the README). After the first
# deploy, fill in the "sync: false" secrets in the Render dashboard.

services:
  - type: web
    name: mediconnect-api
    runtime: node
    plan: free
    rootDir: .
    # --include=dev is required: NODE_ENV=production (below) makes npm skip
    # devDependencies, but the build needs TypeScript and the @types/* packages.
    buildCommand: npm install --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false            # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # service_role secret key (server-only)
      - key: SUPABASE_BUCKET
        value: doctor-photos
      - key: CLIENT_ORIGIN
        sync: false            # the Vercel client URL, e.g. https://mediconnect.vercel.app
      - key: RESEND_API_KEY
        sync: false            # optional — leave blank to disable emails
      - key: SENDER_EMAIL
        sync: false            # e.g. onboarding@resend.dev
      - key: GEMINI_API_KEY
        sync: false            # optional — enables the RAG assistant (free key: aistudio.google.com/apikey)
      - key: JOB_TOKEN
        generateValue: true    # secret for POST /api/jobs/reminders (external cron)
      - key: CALL_SECRET
        generateValue: true    # HMAC secret for video-room names
