# MediConnect — Render Blueprint (v2 monorepo)
# Deploys two services: the Express API (web) and the React client (static site).
# After the first deploy, fill in the "sync: false" values in the Render dashboard.

services:
  # ── Express API ──────────────────────────────────────────────────────
  - type: web
    name: mediconnect-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false            # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # service_role secret key
      - key: SUPABASE_BUCKET
        value: doctor-photos
      - key: RESEND_API_KEY
        sync: false            # optional — leave blank to disable emails
      - key: SENDER_EMAIL
        sync: false            # e.g. noreply@yourdomain.com
      - key: CLIENT_ORIGIN
        sync: false            # the static site URL, e.g. https://mediconnect.onrender.com
      - key: JOB_TOKEN
        generateValue: true    # secret for POST /api/jobs/reminders (external cron)

  # ── React client (static) ────────────────────────────────────────────
  - type: web
    name: mediconnect-client
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=client
    staticPublishPath: ./client/dist
    # SPA fallback so client-side routes (e.g. /doctor/:id) resolve to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false            # same as SUPABASE_URL above
      - key: VITE_SUPABASE_ANON_KEY
        sync: false            # anon/public key (safe in browser)
      - key: VITE_API_URL
        sync: false            # the API URL, e.g. https://mediconnect-api.onrender.com
